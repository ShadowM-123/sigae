<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGAE · Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/sigae.css">
</head>
<body>
<main class="entrada"><div class="caja">
  <img class="logo-img" src="assets/img/logo-shadow.png" alt="Shadow Monitoras Educativas" onerror="this.onerror=null;this.src='assets/img/logo-shadow.svg'">
  <h1>SIGAE</h1>
  <div class="sub">Sistema Integral de Gestión de Acompañamiento Educativo</div>
  <div id="aviso"></div>
  <div class="card"><div class="bd">
    <form id="f" class="form">
      <div class="f"><label>Correo</label><input id="correo" type="email" autocomplete="username" required></div>
      <div class="f"><label>Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>
      <div id="error" class="alerta bad oculto"><span class="tx"></span></div>
      <button class="btn p g" type="submit">Entrar</button>
      <button class="btn ghost" type="button" id="btnOlvide" style="width:100%">¿Olvidaste tu contraseña?</button>
    </form>
  </div></div>
  <div id="demo" class="oculto" style="margin-top:16px">
    <div class="small muted" style="margin:0 0 8px">Modo demo: entra como…</div>
    <div class="demo-usuarios" id="usuariosDemo"></div>
  </div>
  <p class="small muted" style="margin-top:18px;text-align:center">¿Quieres postularte como monitora? <a href="postulacion.html" id="lnkPost">Envía tu postulación</a></p>
</div></main>
<script type="module">
import { db, modoDemo, ruta } from './assets/js/supabase.js';
import { paginaDe } from './assets/js/auth.js';
import { esc, iniciales } from './assets/js/ui.js';

// Enlaces de invitación o recuperación de contraseña (Supabase manda a la Site URL con #access_token…type=invite|recovery)
if (/type=(invite|recovery|magiclink)/.test(location.hash)) location.replace('establecer-clave.html' + location.search + location.hash);
const irPorRol = async (uid) => { const { data } = await db.from('perfiles').select('*').eq('id', uid).maybeSingle(); if (!data) { mostrarError('Tu usuario no tiene perfil asignado. Pide a Dirección que lo active.'); return; } location.href = ruta(paginaDe(data.rol)); };
const mostrarError = m => { const e = document.getElementById('error'); e.classList.remove('oculto'); e.querySelector('.tx').textContent = m; };

// ¿ya hay sesión?
const { data: s } = await db.auth.getUser(); if (s?.user) irPorRol(s.user.id);

document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const { data, error } = await db.auth.signInWithPassword({ email: document.getElementById('correo').value.trim(), password: document.getElementById('clave').value });
  if (error) { mostrarError(error.message === 'Invalid login credentials' ? 'Correo o contraseña incorrectos.' : error.message); return; }
  irPorRol(data.user.id);
};

document.getElementById('btnOlvide').onclick = async () => {
  const correo = document.getElementById('correo').value.trim(); if (!correo) { mostrarError('Escribe tu correo arriba y vuelve a tocar «¿Olvidaste tu contraseña?».'); return; }
  if (modoDemo) { mostrarError('En la demo no hay contraseñas: elige un usuario abajo.'); return; }
  const { error } = await db.auth.resetPasswordForEmail(correo, { redirectTo: new URL('establecer-clave.html', location.href).href });
  mostrarError(error ? error.message : 'Si el correo está registrado, te llegará un enlace para crear una contraseña nueva.');
};
if (modoDemo) {
  document.getElementById('demo').classList.remove('oculto');
  document.getElementById('aviso').innerHTML = '<div class="alerta warn" style="margin-bottom:12px"><span class="tx"><b>Versión de demostración.</b> Datos ficticios. Elige un usuario abajo; la contraseña no se valida.</span></div>';
  const { data: ps } = await db.from('perfiles').select('*').eq('activo', true).order('rol');
  const orden = { direccion: 0, monitora: 1, familia: 2, especialista: 3 };
  const etiqueta = { direccion: 'Dirección', monitora: 'Monitora educativa', familia: 'Familia', especialista: 'Especialista o personal escolar' };
  document.getElementById('usuariosDemo').innerHTML = ps.filter(p => p.id !== 'p-andres').sort((a, b) => orden[a.rol] - orden[b.rol]).map(p => `<button data-correo="${esc(p.correo)}"><span class="ava">${iniciales(p.nombre)}</span><span><b>${esc(p.nombre)}</b><small>${etiqueta[p.rol]} · ${esc(p.correo)}</small></span></button>`).join('');
  document.querySelectorAll('#usuariosDemo button').forEach(b => b.onclick = async () => { const { data } = await db.auth.signInWithPassword({ email: b.dataset.correo, password: 'demo' }); irPorRol(data.user.id); });
}
</script>
</body>
</html>
